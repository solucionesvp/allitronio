<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-documento" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#21566c"/>
      <stop offset="55%" stop-color="#034058"/>
      <stop offset="100%" stop-color="#101820"/>
    </linearGradient>
    <linearGradient id="sheen-documento" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge-documento" x1="0%" y1="0%" x2="0%" y2="100%">
