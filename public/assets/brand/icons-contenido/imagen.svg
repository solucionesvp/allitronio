    <circle cx="204" cy="204" r="20" fill="#FFFFFF" fill-opacity="0.9"/>
    <path d="M150 320 l64 -64 l40 40 l48 -56 l70 70 v14 a10 10 0 0 1 -10 10 h-202 a10 10 0 0 1 -10 -10 z"
