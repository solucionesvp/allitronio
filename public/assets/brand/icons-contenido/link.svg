<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-link" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#21566c"/>
      <stop offset="55%" stop-color="#034058"/>
      <stop offset="100%" stop-color="#101820"/>
    </linearGradient>
    <linearGradient id="sheen-link" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge-link" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="12%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="accent-link" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6b18a"/>
      <stop offset="55%" stop-color="#F2874C"/>
      <stop offset="100%" stop-color="#9d5731"/>
    </linearGradient>
    <filter id="shadow-link" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glyphshadow-link" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#9d5731" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect x="44" y="40" width="424" height="424" rx="104" fill="url(#bg-link)" filter="url(#shadow-link)"/>
  <rect x="44" y="40" width="424" height="424" rx="104" fill="none" stroke="url(#edge-link)" stroke-width="2"/>
  <rect x="44" y="40" width="424" height="424" rx="104" fill="url(#sheen-link)"/>

  <g filter="url(#glyphshadow-link)">
    <g stroke="url(#accent-link)" stroke-width="34" stroke-linecap="round" fill="none">
      <path d="M198 314 l-34 34 a54 54 0 0 1 -76 -76 l46 -46"/>
      <path d="M314 198 l34 -34 a54 54 0 0 0 -76 -76 l-46 46"/>
    </g>
    <line x1="206" y1="306" x2="306" y2="206" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="20" stroke-linecap="round"/>

  </g>
</svg>
