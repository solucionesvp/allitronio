<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-pdf" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#21566c"/>
      <stop offset="55%" stop-color="#034058"/>
      <stop offset="100%" stop-color="#101820"/>
    </linearGradient>
    <linearGradient id="sheen-pdf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge-pdf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="12%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="accent-pdf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6b18a"/>
      <stop offset="55%" stop-color="#F2874C"/>
      <stop offset="100%" stop-color="#9d5731"/>
    </linearGradient>
    <filter id="shadow-pdf" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glyphshadow-pdf" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#9d5731" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect x="44" y="40" width="424" height="424" rx="104" fill="url(#bg-pdf)" filter="url(#shadow-pdf)"/>
  <rect x="44" y="40" width="424" height="424" rx="104" fill="none" stroke="url(#edge-pdf)" stroke-width="2"/>
  <rect x="44" y="40" width="424" height="424" rx="104" fill="url(#sheen-pdf)"/>

  <g filter="url(#glyphshadow-pdf)">
    <path d="M186 118 h96 l58 58 v168 a14 14 0 0 1 -14 14 h-140 a14 14 0 0 1 -14 -14 v-212 a14 14 0 0 1 14 -14 z"
          fill="url(#accent-pdf)" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>
    <path d="M282 118 v44 a14 14 0 0 0 14 14 h44 z" fill="#FFFFFF" fill-opacity="0.28"/>
    <rect x="176" y="298" width="160" height="66" rx="14" fill="#101820"/>
    <text x="256" y="343" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700"
          fill="#FFFFFF" text-anchor="middle" letter-spacing="1">PDF</text>

  </g>
</svg>
