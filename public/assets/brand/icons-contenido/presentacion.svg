<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-presentacion" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#21566c"/>
      <stop offset="55%" stop-color="#034058"/>
      <stop offset="100%" stop-color="#101820"/>
    </linearGradient>
    <linearGradient id="sheen-presentacion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge-presentacion" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="12%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="accent-presentacion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6b18a"/>
      <stop offset="55%" stop-color="#F2874C"/>
      <stop offset="100%" stop-color="#9d5731"/>
    </linearGradient>
    <filter id="shadow-presentacion" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glyphshadow-presentacion" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#9d5731" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect x="44" y="40" width="424" height="424" rx="104" fill="url(#bg-presentacion)" filter="url(#shadow-presentacion)"/>
  <rect x="44" y="40" width="424" height="424" rx="104" fill="none" stroke="url(#edge-presentacion)" stroke-width="2"/>
  <rect x="44" y="40" width="424" height="424" rx="104" fill="url(#sheen-presentacion)"/>

  <g filter="url(#glyphshadow-presentacion)">
    <rect x="140" y="150" width="232" height="164" rx="20" fill="url(#accent-presentacion)"
          stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>
    <rect x="164" y="248" width="26" height="42" rx="6" fill="#FFFFFF" fill-opacity="0.9"/>
    <rect x="200" y="220" width="26" height="70" rx="6" fill="#FFFFFF" fill-opacity="0.75"/>
    <rect x="236" y="236" width="26" height="54" rx="6" fill="#FFFFFF" fill-opacity="0.6"/>
    <rect x="272" y="200" width="26" height="90" rx="6" fill="#FFFFFF" fill-opacity="0.9"/>
    <path d="M234 314 l22 -30 l22 30 z" fill="#101820" fill-opacity="0.55"/>
    <rect x="204" y="314" width="104" height="10" rx="5" fill="#101820" fill-opacity="0.55"/>

  </g>
</svg>
