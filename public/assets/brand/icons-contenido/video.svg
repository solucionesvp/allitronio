<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-video" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#21566c"/>
      <stop offset="55%" stop-color="#034058"/>
      <stop offset="100%" stop-color="#101820"/>
    </linearGradient>
    <linearGradient id="sheen-video" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge-video" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="12%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="accent-video" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5fcbf6"/>
      <stop offset="55%" stop-color="#09AFF2"/>
      <stop offset="100%" stop-color="#05719d"/>
    </linearGradient>
    <filter id="shadow-video" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glyphshadow-video" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#05719d" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect x="44" y="40" width="424" height="424" rx="104" fill="url(#bg-video)" filter="url(#shadow-video)"/>
  <rect x="44" y="40" width="424" height="424" rx="104" fill="none" stroke="url(#edge-video)" stroke-width="2"/>
  <rect x="44" y="40" width="424" height="424" rx="104" fill="url(#sheen-video)"/>

  <g filter="url(#glyphshadow-video)">
    <rect x="150" y="164" width="212" height="184" rx="28" fill="url(#accent-video)"
          stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>
    <path d="M232 220 l72 36 -72 36 z" fill="#FFFFFF" fill-opacity="0.92"/>

  </g>
</svg>
